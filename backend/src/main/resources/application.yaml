
server:
  port: ${PORT:8080}

spring:
  application:
    name: stizy

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stizy}
    username: ${DB_USER:stizy}
    password: ${DB_PASSWORD:stizy_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # EXTRA-04: o SMTP dos lembretes é configurado só por variáveis de ambiente
  # (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
  # Sem SPRING_MAIL_HOST, os lembretes só aparecem no log. Ver docs/API.md.

stizy:
  jwt:
    secret-base64: ${JWT_SECRET}
    issuer: stizy
    expiration-minutes: 120

  # Endereço do front: CORS e link público do negócio (EXTRA-02)
  front-url: ${FRONT_URL:http://localhost:5173}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173}

  agenda:
    fuso: ${AGENDA_FUSO:America/Recife}   # grade semanal na hora local do negócio
    intervalo-minutos: 30                 # de quanto em quanto tempo os horários são oferecidos
    antecedencia-minima-minutos: 0        # reserva só a partir de agora + N minutos
    antecedencia-cancelamento-minutos: 0  # cliente cancela/remarca até N minutos antes
    dias-maximos: 90                      # até quantos dias à frente dá para agendar

  lembretes:
    habilitado: ${LEMBRETES_HABILITADOS:false}
    antecedencia: PT24H   # envia para agendamentos que começam nas próximas 24 h
    intervalo: PT5M       # de quanto em quanto tempo procura lembretes pendentes
    remetente: ${MAIL_REMETENTE:nao-responda@stizy.local}
